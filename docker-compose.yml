# Три сервиса: gpt-api (CLIProxyAPI — GPT-семейство), grok-cli-api
# (Grok Build CLI — все остальные модели) и мост-агрегатор, который
# отдаёт всё одним OpenAI-совместимым endpoint для Open WebUI.
#
# Внешние порты: см. docker-compose.override.yml (опционально).

services:
  # GPT-семейство: CLIProxyAPI поверх любого OpenAI-совместимого релея.
  # Мост берёт из этого бэкенда только модели gpt-*.
  gpt-api:
    image: eceasy/cli-proxy-api:v7.2.149
    container_name: gpt-api
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - API_PORT=8317
      - API_KEYS=sk-internal-gpt-api-key
      - PROVIDER_BASE_URL=${GPT_PROVIDER_BASE_URL:?set in .env}
      - PROVIDER_API_KEY=${GPT_PROVIDER_API_KEY:?set in .env}
    volumes:
      - ./docker/cli-proxy-entrypoint.sh:/entrypoint.sh:ro
      - gpt-api-auth:/root/.cli-proxy-api
      - gpt-api-logs:/CLIProxyAPI/logs
    restart: unless-stopped

  # Универсальный CLI-сервис (Grok Build CLI + полный каталог провайдера).
  # Обслуживает все остальные модели: grok, gemini, китайские и т.д.
  grok-cli-api:
    build: ./grok-cli-api
    container_name: grok-cli-api
    environment:
      - GROK_BASE_URL=${GROK_BASE_URL:?set in .env}
      - GROK_API_KEY=${GROK_API_KEY:?set in .env}
      - GROK_API_TIMEOUT=${GROK_API_TIMEOUT:?set in .env}
    volumes:
      - grok-config:/data/.grok
    restart: unless-stopped

  # Мост: единый OpenAI-совместимый endpoint для Open WebUI.
  model-bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    container_name: model-bridge
    environment:
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:?set in .env}
      - BRIDGE_CACHE_TTL=${BRIDGE_CACHE_TTL:?set in .env}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

volumes:
  gpt-api-auth:
  gpt-api-logs:
  grok-config:
