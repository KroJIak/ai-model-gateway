
services:
  gpt-api:
    image: eceasy/cli-proxy-api:v7.2.149
    container_name: gpt-api
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - API_PORT=8317
      - API_KEYS=sk-internal-gpt-api-key
      - PROVIDER_BASE_URL=${GPT_PROVIDER_BASE_URL:?set in .env}
      - PROVIDER_API_KEY=${GPT_PROVIDER_API_KEY:?set in .env}
    volumes:
      - ./docker/cli-proxy-entrypoint.sh:/entrypoint.sh:ro
      - gpt-api-auth:/root/.cli-proxy-api
      - gpt-api-logs:/CLIProxyAPI/logs
    restart: unless-stopped

  grok-cli-api:
    build: ./grok-cli-api
    container_name: grok-cli-api
    environment:
      - GROK_BASE_URL=${GROK_BASE_URL:?set in .env}
      - GROK_API_KEY=${GROK_API_KEY:?set in .env}
      - GROK_API_TIMEOUT=${GROK_API_TIMEOUT:?set in .env}
      - COMPAT_RESPONSES_MODELS=${COMPAT_RESPONSES_MODELS:?set in .env}
    volumes:
      - grok-config:/data/.grok
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  model-bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    container_name: model-bridge
    environment:
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:?set in .env}
      - BRIDGE_CACHE_TTL=${BRIDGE_CACHE_TTL:?set in .env}
      - BRIDGE_READ_TIMEOUT=${BRIDGE_READ_TIMEOUT:?set in .env}
      - TOOLS_RETRY_TTL_DAYS=${TOOLS_RETRY_TTL_DAYS:?set in .env}
      - PROVIDER_BASE_URL=${GROK_BASE_URL:?set in .env}
      - PROVIDER_API_KEY=${GROK_API_KEY:?set in .env}
      - PROVIDER_LEVELS_TTL=${PROVIDER_LEVELS_TTL:?set in .env}
      - MODELSDEV_TTL=${MODELSDEV_TTL:?set in .env}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      gpt-api:
        condition: service_started
      grok-cli-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gpt-api-auth:
  gpt-api-logs:
  grok-config:
