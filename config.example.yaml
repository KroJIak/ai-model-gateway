# Конфиг моста. Бэкенды опрашиваются сверху вниз — модель закрепляется
# за первым бэкендом, который её отдаёт (специализированные сервисы выше).

bridge:
  api_key: ""            # опционально: Bearer-ключ для защиты самого моста

backends:
  # --- специализированные CLI-сервисы (строгие списки моделей) ---
  - name: gemini
    enabled: true
    base_url: http://gemini-cli-api:8765/v1
    api_key: ""                       # опциональный ключ самого сервиса
    model_meta:                       # пометки для всех моделей бэкенда
      features:
        web_search: true              # нативный поиск Gemini CLI
        builtin_tools: true
      notes: "native CLI environment"

  - name: grok
    enabled: true
    base_url: http://grok-cli-api:8090/v1
    api_key: ""
    model_meta:
      features:
        web_search: true              # поиск выполняет сам Grok CLI
        builtin_tools: false          # каналы провайдера ломаются от мульти-tools
      notes: "native CLI environment; max 1 tool per request"

  # --- существующий CLIProxyAPI (GPT-семейство) ---
  - name: gpt
    enabled: true
    base_url: ${GPT_API_BASE_URL}/v1
    api_key: ${GPT_API_KEY}
    include:
      - "gpt-*"                       # строго: только gpt-модели по имени
    model_meta:
      features:
        web_search: true              # нативный поиск codex-канала
        builtin_tools: true

  # --- прочие модели того же провайдера (китайские и т.д.) ---
  - name: other
    enabled: true
    base_url: ${GPT_API_BASE_URL}/v1
    api_key: ${GPT_API_KEY}
    exclude:
      - "gpt-*"
      - "grok-*"
      - "gemini-*"
    catch_all: true
    model_meta:
      features:
        web_search: false             # неизвестно — помечаем как без интернета
        builtin_tools: false
      notes: "unverified channel"
